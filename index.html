<style>
:root{--bg:#f7f8fa;--card:#fff;--ink:#0f1b3d;--tx:#475569;--bd:#e2e8f0;--ac:#4f46e5;--soft:rgba(79,70,229,.1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1020;--card:#131a30;--ink:#fff;--tx:#cbd5e1;--bd:#26304d;--soft:rgba(129,140,248,.18);color-scheme:dark}}
:root[data-theme=dark]{--bg:#0b1020;--card:#131a30;--ink:#fff;--tx:#cbd5e1;--bd:#26304d;--soft:rgba(129,140,248,.18);color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Sora,Inter,sans-serif;color:var(--ink);margin:0}
a{color:inherit;text-decoration:none}.w{max-width:1100px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:9;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
nav{display:flex;align-items:center;justify-content:space-between;height:56px}nav ul{display:flex;gap:22px;list-style:none;margin:0;padding:0;font-size:14px;font-weight:500}
@media(max-width:640px){nav ul{display:none}}
nav a:hover,.lk:hover{color:var(--ac)}button{font:inherit;cursor:pointer}
.tg{background:none;border:0;color:var(--tx);font-size:18px}
.btn{display:inline-flex;gap:8px;align-items:center;padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;border:1px solid var(--bd);color:var(--ink);transition:.2s}
.pr{background:var(--ink);color:var(--bg);border-color:var(--ink)}.pr:hover,.btn:hover{border-color:var(--ac);color:var(--ac)}.pr:hover{background:var(--ac);color:#fff}
.hero{display:grid;gap:40px;grid-template-columns:1.4fr 1fr;align-items:center;padding:80px 0}
@media(max-width:800px){.hero{grid-template-columns:1fr;padding:48px 0}}
.hero h1{font-size:clamp(40px,7vw,64px);line-height:1.1}.ey{color:var(--ac);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.photo{width:100%;max-width:340px;aspect-ratio:4/5;object-fit:cover;object-position:center 20%;border-radius:24px;border:1px solid var(--bd);box-shadow:0 20px 50px -20px rgba(79,70,229,.5);justify-self:center}
section.s{padding:70px 0}.s h2{font-size:clamp(28px,4vw,38px);margin:6px 0 32px}
.g{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.c{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px;transition:.25s}.h:hover{transform:translateY(-4px);border-color:var(--ac);box-shadow:0 12px 30px -15px rgba(79,70,229,.4)}
.t{display:inline-block;background:var(--soft);color:var(--ac);font-size:12px;font-weight:500;padding:3px 11px;border-radius:99px;margin:0 6px 6px 0}
.pc{padding:0;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}.pc .b{padding:20px;display:flex;flex-direction:column;flex:1}.pc img,.mk{width:100%;height:170px;object-fit:cover;object-position:top;display:block;background:#0b1020}
.tl{border-left:2px solid var(--bd);margin-left:6px;padding-left:28px}.tl>div{position:relative;margin-bottom:24px}.tl>div:before{content:"";position:absolute;left:-36px;top:26px;width:12px;height:12px;border-radius:50%;background:var(--ac)}
ul.l{padding-left:20px;margin:8px 0}.dt h2{font-size:22px;margin:34px 0 10px}.sh{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}.sh figure{margin:0;border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:var(--card)}.sh img{width:100%;display:block}.sh figcaption{padding:10px 14px;font-size:13px}
.note{border:1px dashed var(--ac);border-radius:12px;padding:12px 16px;font-size:14px;background:var(--soft)}
.mk{height:auto;min-height:190px;padding:14px;color:#cbd5e1;font-size:11px;display:flex;flex-direction:column;gap:8px}.mk .bar{height:9px;border-radius:5px;background:#26304d}.mk .bx{border:2px solid #34d399;border-radius:6px;color:#34d399;padding:2px 6px;display:inline-block}.mk .bb{background:#26304d;border-radius:10px;padding:8px 10px;max-width:85%}.mk .bb.u{align-self:flex-end;background:#4f46e5;color:#fff}
.tab{display:flex;gap:6px;flex-wrap:wrap}.tab span{background:#26304d;border-radius:6px;padding:3px 8px}footer{border-top:1px solid var(--bd);padding:28px 0;font-size:14px}
</style>

function detail(k){const p=P[k];return `<article class="dt" style="padding:40px 0 60px"><a class="lk" href="#" onclick="go('');return false" style="color:var(--ac);font-weight:600">← All projects</a><p class="ey" style="margin-top:24px">${p.cat}</p><h1 style="font-size:clamp(28px,5vw,40px)">${p.n}</h1><p>${p.st}</p>${p.note?`<p class="note">${p.note}</p>`:""}
<h2>1. Project Overview</h2><p>${p.ov}</p><h2>2. Problem Statement</h2><p>${p.pb}</p><h2>3. Proposed Solution</h2><p>${p.sol}</p><h2>4. Technical Architecture</h2>${L(p.arch)}<h2>5. Technologies & Tools</h2>${T(p.tech)}<h2>6. My Contributions</h2>${L(p.con)}<h2>7. Implementation Details</h2>${L(p.imp)}${p.res?`<h2>8. Results & Evaluation</h2>${L(p.res)}`:""}
<h2>9. Screenshots Gallery</h2><div class="sh">${p.shots.map(s=>`<figure>${pic(s[0],1)}<figcaption>${s[1]}</figcaption></figure>`).join("")}</div>
<h2>10. Project Resources</h2><p style="display:flex;gap:10px;flex-wrap:wrap">${p.links.github?`<a class="btn" target="_blank" rel="noopener noreferrer" href="${p.links.github}">GitHub Repository</a>`:""}${p.links.demo?`<a class="btn" target="_blank" rel="noopener noreferrer" href="${p.links.demo}">Live Demo</a>`:""}${p.links.video?`<a class="btn" target="_blank" rel="noopener noreferrer" href="${p.links.video}">Video Demonstration</a>`:""}${Object.keys(p.links).length?"":"No public resources available yet."}</p></article>`}
function render(){const k=location.hash.slice(1);const app=document.getElementById("app");if(P[k]){app.innerHTML=detail(k);document.title=P[k].n+" — Ikram NAFID";scrollTo(0,0)}else{app.innerHTML=home();document.title="Ikram NAFID — AI Engineering Student";if(k&&document.getElementById(k))document.getElementById(k).scrollIntoView()}}
function go(k){location.hash=k;if(!k)render()}
function sc(id){if(P[location.hash.slice(1)]){location.hash="";setTimeout(()=>document.getElementById(id).scrollIntoView(),50)}else document.getElementById(id).scrollIntoView({behavior:"smooth"})}
addEventListener("hashchange",render);render();
document.getElementById("tg").onclick=()=>{const d=document.documentElement,dark=matchMedia("(prefers-color-scheme: dark)").matches;const cur=d.dataset.theme||(dark?"dark":"light");d.dataset.theme=cur=="dark"?"light":"dark"};
</script>
